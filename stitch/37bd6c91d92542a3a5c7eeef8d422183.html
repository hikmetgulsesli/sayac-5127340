<style type="text/tailwindcss">
        @layer utilities {
            .glass {
                @apply bg-surface-container-lowest/70 backdrop-blur-[20px];
            }
            .text-display-lg {
                @apply font-headline text-[3.5rem] font-bold tracking-[-0.02em] leading-tight;
            }
            .text-headline-lg {
                @apply font-headline text-[2.0rem] font-semibold leading-snug;
            }
            .text-title-md {
                @apply font-body text-[1.125rem] font-medium leading-normal;
            }

                @apply font-body text-[0.875rem] font-normal leading-relaxed;
            }
            .text-label-sm {
                @apply font-label text-[0.6875rem] font-semibold leading-none;
            }

                @apply font-label text-sm font-medium tracking-[0.1em] uppercase;

            .no-scrollbar::-webkit-scrollbar {
                display: none;

                -ms-overflow-style: none;

<body class="bg-background text-on-surface font-body min-h-screen flex flex-col antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- TopAppBar JSON Component -->
<header class="sticky top-0 w-full z-40 bg-slate-50/70 backdrop-blur-xl transition-colors duration-300">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto">
<h1 class="font-['Space_Grotesk'] text-xl font-bold text-indigo-600 tracking-[-0.02em]">Sayaç</h1>
<div class="flex items-center gap-4">
<button class="text-slate-500 hover:bg-slate-200/50 rounded-full p-2 transition-transform scale-95 active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="light_mode">light_mode</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col w-full max-w-md mx-auto px-6 pt-8 pb-32">
<!-- Counter Display Area -->
<section class="flex flex-col items-start mb-12">
<h2 class="text-label-md text-tertiary mb-2">GÜNCEL SAYAÇ</h2>
<div class="flex items-end gap-2">
<span class="text-display-lg text-primary">42</span>
</div>
</section>
<!-- Primary Action Area -->
<section class="flex justify-center mb-16">
<button class="btn-primary-gradient w-48 h-48 rounded-full flex flex-col items-center justify-center shadow-[0_20px_48px_rgba(70,72,212,0.25)] active:scale-95 transition-transform duration-200 focus:outline-none focus:ring-4 focus:ring-primary-fixed">
<span class="material-symbols-outlined text-white text-[4rem] mb-2" data-icon="add" style="font-variation-settings: 'wght' 300;">add</span>
<span class="text-on-primary text-title-md font-semibold">ARTIR</span>
</button>
</section>
<!-- Secondary Actions Grid -->
<section class="grid grid-cols-2 gap-4 mb-12">
<button class="bg-surface-container-high rounded-xl p-4 flex flex-col items-center justify-center text-on-surface hover:bg-surface-variant transition-colors active:scale-95 focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined mb-2 text-primary" data-icon="remove">remove</span>
<span class="text-label-sm uppercase tracking-wider">AZALT</span>
</button>
<button class="bg-surface-container-high rounded-xl p-4 flex flex-col items-center justify-center text-on-surface hover:bg-surface-variant transition-colors active:scale-95 focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined mb-2 text-error" data-icon="restart_alt">restart_alt</span>
<span class="text-label-sm uppercase tracking-wider text-error">SIFIRLA</span>
</button>
</section>
<!-- Recent History Header -->
<div class="flex justify-between items-end mb-6">
<h3 class="text-headline-lg text-on-surface">Son İşlemler</h3>
<button class="text-primary text-label-sm uppercase tracking-wider hover:text-primary-container transition-colors p-2">Tümü</button>
</div>
<!-- History List (Scrollable) -->
<section class="flex-1 overflow-y-auto no-scrollbar pb-8 space-y-4">
<div class="bg-surface-container-low rounded-lg p-4 flex items-center justify-between shadow-[0_4px_24px_rgba(17,28,45,0.02)]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed">
<span class="material-symbols-outlined text-sm" data-icon="add">add</span>
</div>
<div>
<p class="text-title-md text-on-surface">+1 Eklendi</p>
<p class="text-body-md text-on-surface-variant">Bugün, 14:30</p>
</div>
</div>
<span class="text-title-md font-semibold text-primary">42</span>
</div>
<div class="bg-surface-variant rounded-lg p-4 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed">
<span class="material-symbols-outlined text-sm" data-icon="add">add</span>

<div>

<div class="bg-surface-container-low rounded-lg p-4 flex items-center justify-between shadow-[0_4px_24px_rgba(17,28,45,0.02)]">

<div class="w-10 h-10 rounded-full bg-error-container flex items-center justify-center text-on-error-container">
<span class="material-symbols-outlined text-sm" data-icon="remove">remove</span>
</div>
<div>
<p class="text-title-md text-on-surface">-1 Çıkarıldı</p>
<p class="text-body-md text-on-surface-variant">Dün, 18:45</p>
</div>
</div>
<span class="text-title-md font-semibold text-on-surface">40</span>
</div>
</section>
</main>

<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="font-['Inter'] text-[11px] font-semibold uppercase tracking-[0.1em]">Geçmiş</span>
