<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sayaç - Geçmiş</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#f9f9ff",
                        "on-secondary-container": "#fffbff",
                        "surface-container": "#e7eeff",
                        "surface-variant": "#d8e3fb",
                        "surface-dim": "#cfdaf2",
                        "primary-fixed-dim": "#c0c1ff",
                        "surface-container-high": "#dee8ff",
                        "surface-tint": "#494bd6",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#301400",
                        "tertiary": "#904900",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#fffbff",
                        "surface-container-highest": "#d8e3fb",
                        "outline-variant": "#c7c4d7",
                        "primary-container": "#6063ee",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb783",
                        "primary": "#4648d4",
                        "on-tertiary-fixed-variant": "#703700",
                        "on-secondary-fixed-variant": "#5516be",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#263143",
                        "secondary-container": "#8455ef",
                        "on-surface-variant": "#464554",
                        "on-tertiary-container": "#fffbff",
                        "primary-fixed": "#e1e0ff",
                        "surface-bright": "#f9f9ff",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#e9ddff",
                        "on-background": "#111c2d",
                        "on-surface": "#111c2d",
                        "inverse-primary": "#c0c1ff",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#23005c",
                        "outline": "#767586",
                        "tertiary-container": "#b55d00",
                        "secondary-fixed-dim": "#d0bcff",
                        "on-tertiary": "#ffffff",
                        "secondary": "#6b38d4",
                        "surface": "#f9f9ff",
                        "inverse-on-surface": "#ecf1ff",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#07006c",
                        "surface-container-low": "#f0f3ff",
                        "tertiary-fixed": "#ffdcc5"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": [
                            "Space Grotesk"
                        ],
                        "body": [
                            "Inter"
                        ],
                        "label": [
                            "Inter"
                        ]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[style*="'FILL' 1"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="bg-slate-50/70 backdrop-blur-xl docked full-width top-0 z-40 no-border shadow-none">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto">
<div class="text-xl font-bold text-indigo-600 tracking-[-0.02em] font-headline">Sayaç</div>
<div class="flex items-center space-x-4">
<button class="text-indigo-600 hover:bg-slate-200/50 transition-colors scale-95 active:scale-90 duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="light_mode">light_mode</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col md:flex-row max-w-7xl mx-auto w-full px-6 py-12 md:py-24 gap-12 md:gap-24 overflow-hidden relative pb-32">
<!-- Left Column: The Kinetic Instrument (Counter) -->
<div class="flex-1 flex flex-col justify-center items-start relative z-10">
<div class="w-full relative group">
<!-- Background Tonal Shift for the instrument area -->
<div class="absolute inset-0 bg-surface-container-low rounded-xl -z-10 transform scale-105 opacity-50 group-hover:opacity-80 transition-opacity duration-500"></div>
<h1 class="font-headline text-[3.5rem] font-bold tracking-tight text-on-surface leading-none mb-8 ml-4">
                    0
                </h1>
<div class="flex flex-row gap-6 ml-4">
<button class="w-16 h-16 rounded-xl flex items-center justify-center bg-gradient-to-br from-primary to-primary-container text-on-primary shadow-[0_8px_32px_rgba(70,72,212,0.2)] hover:shadow-[0_12px_48px_rgba(70,72,212,0.3)] transform scale-100 active:scale-96 transition-all duration-300 relative overflow-hidden group">
<span class="absolute inset-0 bg-white/20 transform -translate-x-full skew-x-12 group-hover:animate-[shimmer_1.5s_infinite]"></span>
<span class="material-symbols-outlined text-3xl font-light">remove</span>
</button>
<button class="w-24 h-24 rounded-xl flex items-center justify-center bg-gradient-to-br from-primary to-primary-container text-on-primary shadow-[0_12px_48px_rgba(70,72,212,0.3)] hover:shadow-[0_16px_64px_rgba(70,72,212,0.4)] transform scale-100 active:scale-96 transition-all duration-300 relative overflow-hidden group">
<span class="absolute inset-0 bg-white/20 transform -translate-x-full skew-x-12 group-hover:animate-[shimmer_1.5s_infinite]"></span>
<span class="material-symbols-outlined text-5xl font-light">add</span>
</button>
</div>
</div>
<div class="mt-16 ml-4 flex items-center gap-3">
<button class="px-6 py-3 rounded-full bg-surface-container-highest text-on-surface-variant font-label text-sm tracking-widest uppercase hover:bg-surface-variant transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-lg">restart_alt</span>
                    Sıfırla
                </button>
</div>
</div>
<!-- Right Column: Empty History State -->
<div class="flex-1 flex flex-col justify-center bg-surface-container-low rounded-xl p-12 relative overflow-hidden">
<!-- Ghost Border Fallback -->
<div class="absolute inset-0 border border-outline-variant opacity-15 rounded-xl pointer-events-none"></div>
<div class="flex flex-col items-center justify-center text-center space-y-6 z-10">
<div class="w-32 h-32 rounded-full bg-surface-container flex items-center justify-center text-primary-fixed-dim">
<span class="material-symbols-outlined text-6xl" style="font-variation-settings: 'wght' 200;">history</span>
</div>
<div class="space-y-2 max-w-sm">
<h2 class="font-headline text-2xl font-semibold text-on-surface">Henüz işlem yapılmadı</h2>
<p class="font-body text-on-surface-variant text-base">Sayaç değerini değiştirmek için butonları kullanın.</p>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden bg-white/80 backdrop-blur-2xl fixed bottom-0 w-full z-50 rounded-t-[2.5rem] no-border shadow-[0_-8px_30px_rgb(0,0,0,0.04)] pb-8 pt-4 px-8">
<div class="flex justify-around items-center">
<!-- Inactive Tab -->
<a class="flex flex-col items-center justify-center text-slate-400 px-6 py-2 hover:text-indigo-500 active:scale-95 transition-all duration-300" href="#">
<span class="material-symbols-outlined mb-1">plus_one</span>
<span class="font-['Inter'] text-[11px] font-semibold uppercase tracking-[0.1em]">Sayaç</span>
</a>
<!-- Active Tab -->
<a class="flex flex-col items-center justify-center bg-indigo-600 text-white rounded-full px-6 py-2 transition-all duration-300 shadow-[0_8px_32px_rgba(70,72,212,0.3)] transform scale-105" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">history</span>
<span class="font-['Inter'] text-[11px] font-semibold uppercase tracking-[0.1em]">Geçmiş</span>
</a>
</div>
</nav>
<!-- Desktop SideNav equivalent (Hidden on Mobile) -->
<nav class="hidden md:flex fixed right-8 top-1/2 -translate-y-1/2 flex-col gap-6 z-50">
<a class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:bg-surface-variant hover:text-primary transition-colors group relative shadow-sm" href="#">
<span class="material-symbols-outlined">plus_one</span>
<span class="absolute right-full mr-4 bg-inverse-surface text-inverse-on-surface text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">Sayaç</span>
</a>
<a class="w-12 h-12 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-[0_8px_32px_rgba(70,72,212,0.3)] group relative" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">history</span>
<span class="absolute right-full mr-4 bg-inverse-surface text-inverse-on-surface text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">Geçmiş</span>
</a>
</nav>
</body></html>
